---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Releases the crate when a release tag (v<version>) is pushed, through
# the Rust release lane in lfreleng-actions/rust-workflows (Model A).
# Cargo.toml and Cargo.lock keep the placeholder 0.0.0: the tag names
# the version, and the lane writes it over the placeholder before
# building, verifying and publishing (version_source: tag).
#
# crates.io trusts this workflow by its file name and the 'production'
# environment, so renaming either stops publication. The lane publishes
# through Trusted Publishing from inside the reusable workflow: crates.io
# matches the OIDC workflow_ref claim, which names THIS file. Its publish
# job alone holds the credential and runs no crate code; it uploads only
# an archive whose digest matches the one crate-verify compiled and
# tested. The GitHub release is promoted last, so a tag that fails any
# check never yields a published release.
#
# This is the repository's one tag-push workflow, as in the Python
# release lane: a second one would act on tags this one rejects.
name: "Build, Test and Release 🦀"

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Never cancel a release in flight; repeated pushes of one tag queue.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: "Build, Test and Release"
    # Deleting a tag also fires a push event; publish nothing for it.
    if: "!github.event.deleted"
    # A reusable workflow cannot raise its caller's permissions. Each
    # job inside declares its own, narrower set; the attach and publish
    # jobs alone receive id-token: write, and neither runs crate code.
    permissions:
      contents: write       # Draft the GitHub release and attach assets
      id-token: write       # Attestations, Sigstore, Trusted Publishing
      attestations: write   # Build provenance attestations
      pull-requests: read   # repository-metadata-action queries PR data
      issues: read          # grype-scan-action reads cve-bypass issues
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/rust-workflows/.github/workflows/build-test-release.yaml@0506f2415c6374ac562496f017a06e5b8b8a4ae9  # v0.0.1
    with:
      version_source: "tag"
      publish_enabled: true
      publish_environment: "production"
      binaries: true
      # The organisation's release checks, as before the move: the tag
      # must sort above every earlier one and sit on the tip of main.
      tag_enforce_increment: true
      tag_require_branch: "main"
      tag_require_latest: true
