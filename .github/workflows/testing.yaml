# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Build/test workflow for the sample crate
name: "Test Rust Project 🦀"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build-test:
    name: "Build/test sample crate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@2fbf4b0c1098f5e658b75ac019bb039b76fee9b6'  # v0.16.3

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Check formatting"
        shell: bash
        run: |
          # Check formatting
          cargo --version
          cargo fmt --check

      - name: "Lint with Clippy"
        shell: bash
        run: |
          # Lint with Clippy
          cargo clippy --all-targets --locked -- -D warnings

      - name: "Run tests"
        shell: bash
        run: |
          # Run tests
          cargo test --locked

      # The actions this crate exists to test package and publish it,
      # so prove both stay clean here first. The dry run reads the
      # crates.io index but uploads nothing.
      - name: "Package and dry-run publish"
        shell: bash
        run: |
          # Package and dry-run publish
          cargo package --locked
          cargo publish --dry-run --locked --no-verify
          version="$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[0].version')"
          crate="target/package/lfreleng-test-rust-project-$version.crate"
          size="$(wc -c < "$crate")"
          echo "Packaged crate: $crate (${size// /} bytes) ✅"
          echo "Packaged crate: ${size// /} bytes ✅" >> "$GITHUB_STEP_SUMMARY"
