version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(actions)"
    # Wait before opening a bump PR so we don't churn on a release
    # that gets retracted or superseded shortly after it ships.
    # This is required to satisfy the zizmor workflow auditing tool.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore(cargo)"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
  # The one fixture variant with a crates.io dependency. The others
  # have none, so watching them would only add empty runs. Callers pin
  # this repository by commit, so a bump never reaches them unasked.
  - package-ecosystem: "cargo"
    directory: "/variants/dependencies"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore(cargo)"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
